# ===================================================================
# ỨNG DỤNG DOCKER SPRING LAB
# ===================================================================
spring.application.name=docker-spring-lab
server.port=8080

# ===================================================================
# CẤU HÌNH DATASOURCE
# Mặc định sử dụng H2 In-Memory Database cho local development.
# Khi chạy qua Docker (hoặc bài thực hành Docker Networking / Docker Compose),
# có thể ghi đè bằng các biến môi trường:
#   - SPRING_DATASOURCE_URL
#   - SPRING_DATASOURCE_USERNAME
#   - SPRING_DATASOURCE_PASSWORD
# Ví dụ khi nối MySQL:
#   SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME=root
#   SPRING_DATASOURCE_PASSWORD=rootpassword
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================================================
# CẤU HÌNH JPA & HIBERNATE
# Lưu ý: Cấu hình 'ddl-auto=update' phục vụ mục đích học tập lab,
# không phải là cấu hình khuyến nghị cho môi trường production thực tế.
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# H2 CONSOLE (Dành cho kiểm tra trực quan local: http://localhost:8080/h2-console)
# JDBC URL trên giao diện: jdbc:h2:mem:productdb | Username: sa | Password: (để trống)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
