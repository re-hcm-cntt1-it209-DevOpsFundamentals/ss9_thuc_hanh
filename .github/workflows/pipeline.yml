name: End-to-End CI/CD Pipeline

on:
  push:
    branches: [main, develop, master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # JOB 1: Build, test và upload JAR
  ci-build:
    name: CI - Test and Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build executable JAR
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-report
          path: build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: build/libs/docker-spring-lab-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  # JOB 2: Download JAR và push Docker Image lên GHCR
  package-docker:
    name: Package - Push Image to GHCR
    needs: ci-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: build/libs/

      - name: Verify downloaded JAR
        run: test -f build/libs/docker-spring-lab-0.0.1-SNAPSHOT.jar

      - name: Determine lowercase GHCR image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # JOB 3: Deploy lên VPS
  cd-deploy:
    name: CD - Deploy to VPS
    needs: package-docker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH and verify health
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ needs.package-docker.outputs.image_name }}
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -eu

            cd /opt/phat/docker-spring-lab

            git pull --ff-only origin main

            printf '%s' "$GHCR_READ_TOKEN" |
              docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

            docker compose -f compose.vps.yaml config --quiet
            docker compose -f compose.vps.yaml pull backend
            docker compose -f compose.vps.yaml up -d --no-build

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8043/api/health; then
                echo
                echo "Health check passed."
                exit 0
              fi
              sleep 2
            done

            docker compose -f compose.vps.yaml logs --tail 100 backend
            exit 1
