name: CD Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Simulate Staging deployment
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          echo "Preparing Staging release..."
          echo "Release version: $RELEASE_VERSION"

          if [ -n "$STAGING_HOST" ]; then
            echo "Staging host secret is configured."
          else
            echo "STAGING_HOST is not configured."
          fi

          if [ -n "$STAGING_URL" ]; then
            echo "Staging URL: $STAGING_URL"
          fi

          echo "Lesson 3 demonstration only."
          echo "No remote server has been modified."

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Simulate Production release
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          echo "Preparing Production release..."
          echo "Release version: $RELEASE_VERSION"

          if [ -n "$PRODUCTION_HOST" ]; then
            echo "Production host secret is configured."
          else
            echo "PRODUCTION_HOST is not configured."
          fi

          if [ -n "$PRODUCTION_URL" ]; then
            echo "Production URL: $PRODUCTION_URL"
          fi

          echo "Lesson 3 demonstration only."
          echo "No remote server has been modified."
